<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Game Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b1e;
    --panel: #161a3a;
    --panel-lo: #0e1029;
    --cyan: #45d4ff;
    --violet: #9b6bff;
    --pink: #ff5fa8;
    --text: #eef0ff;
    --muted: #a3a9cf;
    --line: rgba(255, 255, 255, .1);
    --good: #4ade80;
    --bad: #ff6b8b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--text);
    font-family: Rubik, system-ui, sans-serif;
    background:
      radial-gradient(800px 500px at 10% -10%, rgba(155, 107, 255, .3), transparent 60%),
      radial-gradient(700px 500px at 100% 15%, rgba(69, 212, 255, .14), transparent 60%),
      radial-gradient(1000px 520px at 50% 115%, rgba(255, 95, 168, .2), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }

  /* ---------- Neon grid floor and drifting controller shapes ---------- */
  .floor {
    position: fixed; left: -50%; right: -50%; bottom: 0; height: 70vh; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(155, 107, 255, .5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155, 107, 255, .5) 1px, transparent 1px);
    background-size: 64px 64px;
    transform: perspective(600px) rotateX(42deg);
    transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 75%);
    mask-image: linear-gradient(to top, #000 10%, transparent 75%);
    animation: floor-run 2.4s linear infinite;
  }
  @keyframes floor-run { to { background-position: 0 64px; } }
  .shapes { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .shapes svg {
    position: absolute; bottom: -80px; fill: none; stroke: currentColor; stroke-width: 2.5;
    opacity: .18; animation: drift linear infinite;
  }
  @keyframes drift {
    from { transform: translateY(0) rotate(0); }
    to { transform: translateY(-115vh) rotate(360deg); }
  }

  /* ---------- Unlocked games ---------- */
  main {
    position: relative; z-index: 1; max-width: 1040px; margin: 0 auto;
    padding: calc(96px + env(safe-area-inset-top)) 16px calc(170px + env(safe-area-inset-bottom));
  }

  /* ---------- Your character, top left ---------- */
  .me-chip {
    position: fixed; z-index: 6; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left));
    display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 18px 0 5px; border-radius: 999px; cursor: pointer;
    color: var(--text); font: inherit; text-align: left;
    background: rgba(22, 26, 58, .85); border: 1px solid rgba(155, 107, 255, .5);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .4); backdrop-filter: blur(8px);
    transition: border-color .2s, box-shadow .2s, transform .2s;
  }
  .me-chip:hover, .me-chip:focus-visible { outline: none; border-color: var(--cyan); box-shadow: 0 10px 30px rgba(0, 0, 0, .4), 0 0 24px rgba(69, 212, 255, .35); transform: translateY(-1px); }
  .me-face { width: 46px; height: 46px; flex: none; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--me, var(--cyan)); }
  .me-face svg { width: 100%; height: 100%; display: block; }
  .me-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .me-text b { font: 400 14px Bungee, Rubik, sans-serif; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .me-text span { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .section-title {
    display: flex; align-items: center; gap: 16px; margin: 0 0 24px;
    font-family: Bungee, Rubik, sans-serif; font-size: 16px; letter-spacing: .14em;
    color: var(--cyan); text-shadow: 0 0 14px rgba(69, 212, 255, .6); white-space: nowrap;
  }
  .section-title::before, .section-title::after {
    content: ''; flex: 1; height: 2px; border-radius: 1px;
    background: linear-gradient(90deg, transparent, var(--violet));
  }
  .section-title::after { background: linear-gradient(90deg, var(--violet), transparent); }
  .section-title[hidden] { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 24px; }

  .card {
    display: flex; flex-direction: column; overflow: hidden;
    border-radius: 20px; color: inherit; text-decoration: none;
    background: linear-gradient(180deg, var(--panel), var(--panel-lo));
    border: 1px solid rgba(155, 107, 255, .3);
    box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
    transition: transform .25s cubic-bezier(.2, .8, .2, 1.2), box-shadow .25s, border-color .25s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-6px); outline: none; border-color: var(--cyan);
    box-shadow: 0 26px 60px rgba(0, 0, 0, .55), 0 0 0 1px var(--cyan), 0 0 40px rgba(69, 212, 255, .35);
  }
  .card.fresh { animation: card-in .8s cubic-bezier(.2, .8, .2, 1.2), card-glow 2.4s ease-out; }
  @keyframes card-in { from { opacity: 0; transform: translateY(40px) scale(.9); } }
  @keyframes card-glow {
    0%, 40% { border-color: var(--cyan); box-shadow: 0 0 0 2px var(--cyan), 0 0 60px rgba(155, 107, 255, .6); }
  }
  .thumb { aspect-ratio: 16 / 10; overflow: hidden; border-bottom: 1px solid var(--line); }
  .thumb svg { width: 100%; height: 100%; display: block; transition: transform .4s cubic-bezier(.2, .8, .2, 1); }
  .card:hover .thumb svg { transform: scale(1.04); }
  .card-body { display: flex; flex-direction: column; flex: 1; padding: 18px 22px 22px; }
  .tag {
    align-self: flex-start; height: 24px; display: inline-flex; align-items: center;
    padding: 0 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--cyan); border: 1px solid rgba(69, 212, 255, .4); background: rgba(69, 212, 255, .08);
  }
  .card h2 {
    font-family: Bungee, Rubik, sans-serif; font-weight: 400; font-size: 21px; margin: 12px 0 6px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card p { color: var(--muted); margin: 0 0 18px; line-height: 1.5; flex: 1; }
  .meta {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding-top: 16px; border-top: 1px solid var(--line);
  }
  .best { font-size: 14px; color: var(--muted); }
  .best strong { color: var(--text); font-variant-numeric: tabular-nums; }
  .play {
    height: 36px; display: inline-flex; align-items: center; padding: 0 20px; border-radius: 999px;
    font-family: Bungee, Rubik, sans-serif; font-size: 13px; letter-spacing: .06em;
    color: var(--bg); background: linear-gradient(90deg, var(--cyan), var(--violet));
    box-shadow: 0 0 18px rgba(155, 107, 255, .4);
  }

  /* ---------- Code box, always at the bottom ---------- */
  .code-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; margin: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 40px max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: linear-gradient(180deg, transparent, rgba(10, 11, 30, .6) 55%);
    pointer-events: none;
  }
  .code-msg {
    min-height: 20px; margin: 0; font-weight: 600; font-size: 15px; text-align: center;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
  }
  .code-msg.ok { color: var(--cyan); }
  .code-msg.bad { color: var(--bad); }
  .code-box {
    pointer-events: auto; cursor: text;
    width: min(560px, 100%); height: 64px; display: flex; align-items: center; gap: 12px;
    padding: 0 8px 0 20px; border-radius: 999px;
    background: rgba(22, 26, 58, .88);
    border: 1px solid rgba(155, 107, 255, .5);
    box-shadow: 0 16px 40px rgba(0, 0, 0, .55);
    backdrop-filter: blur(8px);
    transition: border-color .2s, box-shadow .2s;
  }
  .code-box:focus-within { border-color: var(--cyan); box-shadow: 0 16px 40px rgba(0, 0, 0, .55), 0 0 0 4px rgba(69, 212, 255, .16), 0 0 30px rgba(69, 212, 255, .25); }
  body.empty .code-box:not(:focus-within) { animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { border-color: var(--violet); box-shadow: 0 16px 40px rgba(0, 0, 0, .55), 0 0 34px rgba(155, 107, 255, .45); } }
  .code-box.wrong { border-color: var(--bad); animation: shake .45s; }
  .code-box.right { border-color: var(--good); box-shadow: 0 0 0 4px rgba(74, 222, 128, .2), 0 0 34px rgba(74, 222, 128, .4); }
  @keyframes shake {
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }
  .code-box svg { width: 20px; height: 20px; flex: none; color: var(--cyan); }
  .code-box input {
    flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: none;
    color: var(--text); font: 400 18px Bungee, Rubik, sans-serif; letter-spacing: .12em; text-transform: uppercase;
  }
  .code-box input::placeholder { color: var(--muted); font: 500 17px Rubik, system-ui, sans-serif; letter-spacing: .02em; text-transform: none; opacity: .85; }
  .unlock {
    height: 48px; padding: 0 22px; border: 0; border-radius: 999px; cursor: pointer; flex: none;
    font: 400 14px Bungee, Rubik, sans-serif; letter-spacing: .06em;
    color: var(--bg); background: linear-gradient(90deg, var(--cyan), var(--violet));
    box-shadow: 0 0 20px rgba(155, 107, 255, .45);
    transition: transform .12s, filter .12s, opacity .2s;
  }
  .unlock:hover { filter: brightness(1.1); }
  .unlock:active { transform: translateY(2px); }
  .unlock:disabled { opacity: .6; cursor: progress; }

  @media (max-width: 520px) {
    .code-box { height: 58px; padding-left: 16px; gap: 10px; }
    .code-box input { font-size: 16px; letter-spacing: .08em; }
    .code-box input::placeholder { font-size: 16px; }
    .unlock { height: 44px; padding: 0 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .shapes { display: none; }
    .floor, body.empty .code-box:not(:focus-within), .card.fresh, .code-box.wrong { animation: none; }
  }
</style>
</head>
<body class="empty">
<div class="floor" aria-hidden="true"></div>
<div class="shapes" id="shapes" aria-hidden="true"></div>

<button class="me-chip" id="me-chip" type="button" aria-label="Your character, tickets, quests and prizes">
  <span class="me-face" id="me-face"></span>
  <span class="me-text"><b id="me-name"></b><span id="me-tix"></span></span>
</button>

<main>
  <div class="section-title" id="games-title" hidden>Your games</div>
  <div class="grid" id="games"></div>
</main>

<form class="code-bar" id="code-form" autocomplete="off">
  <p class="code-msg" id="code-msg" role="status" aria-live="polite"></p>
  <label class="code-box" id="code-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <input id="code" type="text" placeholder="Enter a code" aria-label="Game code" maxlength="40"
      autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button class="unlock" id="unlock" type="submit">Unlock</button>
  </label>
</form>

<script src="shared/arcade.js"></script>

  /* LOCKED:end */

  const SAVED_KEY = 'arcade.codes';
  // Codes ignore case, spaces and dashes.
  const normalize = (code) => code.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

  const el = {
    form: document.getElementById('code-form'),
    box: document.getElementById('code-box'),
    input: document.getElementById('code'),
    button: document.getElementById('unlock'),
    msg: document.getElementById('code-msg'),
    games: document.getElementById('games'),
    title: document.getElementById('games-title'),
  };
  const unlocked = new Map(); // LOCKED index -> card

  function savedCodes() {
    try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || []; } catch { return []; }
  }
  function saveCodes(codes) {
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(codes)); } catch { /* storage unavailable */ }
  }

  // Every card the code opens, as [{ index, card }]. A wrong code opens none.
  async function open(code) {
    if (!window.crypto || !crypto.subtle) throw new Error('no-crypto');
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(SALT), iterations: ITERATIONS, hash: 'SHA-256' },
      base,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt'],
    );
    const found = [];
    for (const [index, box] of LOCKED.entries()) {
      try {
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(box.iv) }, key, bytes(box.data));
        found.push({ index, card: JSON.parse(new TextDecoder().decode(plain)) });
      } catch { /* locked with a different code */ }
    }
    return found;
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    return `${m}:${(s - m * 60).toFixed(2).padStart(5, '0')}`;
  }

  // The first stat with a saved value (or a fallback), e.g. "Chips: $1,000".
  function statLine(card) {
    for (const s of card.stats || []) {
      let value = s.fallback;
      try {
        const raw = localStorage.getItem(s.key);
        if (raw !== null) value = Number(JSON.parse(raw));
      } catch { /* unreadable: use the fallback */ }
      if (value === undefined || !Number.isFinite(value)) continue;
      const strong = document.createElement('strong');
      strong.textContent = s.format === 'time' ? formatTime(value) : `$${Math.round(value).toLocaleString('en-US')}`;
      return [`${s.label}: `, strong];
    }
    return [card.empty || ''];
  }

  function cardEl(card) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = card.href;
    a.innerHTML = `
      <div class="thumb">${card.art}</div>
      <div class="card-body">
        <span class="tag"></span>
        <h2></h2>
        <p></p>
        <div class="meta"><span class="best"></span><span class="play">Play</span></div>
      </div>`;
    a.querySelector('.tag').textContent = card.tag;
    a.querySelector('h2').textContent = card.title;
    a.querySelector('p').textContent = card.description;
    a.querySelector('.best').append(...statLine(card));
    return a;
  }

  // Each unlocked game brings its own quests and prizes for your character.
  const loadedRewards = new Set();
  function loadRewards(href) {
    const dir = href.slice(0, href.lastIndexOf('/') + 1);
    if (loadedRewards.has(dir)) return;
    loadedRewards.add(dir);
    const script = document.createElement('script');
    script.src = `${dir}rewards.js`;
    document.head.append(script);
  }

  // Cards keep a fixed order; `fresh` ones play the unlock animation.
  function render(fresh = new Set()) {
    const cards = new Map();
    for (const index of [...unlocked.keys()].sort((x, y) => x - y)) {
      loadRewards(unlocked.get(index).href);
      const a = cardEl(unlocked.get(index));
      if (fresh.has(index)) a.classList.add('fresh');
      cards.set(index, a);
    }
    el.games.replaceChildren(...cards.values());
    el.title.hidden = unlocked.size === 0;
    document.body.classList.toggle('empty', unlocked.size === 0);
    return cards;
  }

  let msgTimer = 0;
  function say(text, kind) {
    el.msg.textContent = text;
    el.msg.className = `code-msg ${kind}`;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { el.msg.textContent = ''; }, 4000);
  }

  function flash(cls) {
    el.box.classList.remove('wrong', 'right');
    void el.box.offsetWidth;
    el.box.classList.add(cls);
    setTimeout(() => el.box.classList.remove(cls), 1200);
  }

  el.form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = normalize(el.input.value);
    if (!code) { el.input.focus(); return; }
    el.button.disabled = true;
    let found = [];
    try {
      found = await open(code);
    } catch {
      el.button.disabled = false;
      say('Codes only work when the site is opened over https.', 'bad');
      return;
    }
    el.button.disabled = false;
    if (!found.length) {
      flash('wrong');
      say('That code doesn\'t work.', 'bad');
      el.input.select();
      return;
    }
    el.input.value = '';
    flash('right');
    const codes = savedCodes();
    if (!codes.includes(code)) saveCodes([...codes, code]);
    const fresh = new Set(found.map((f) => f.index).filter((i) => !unlocked.has(i)));
    for (const f of found) unlocked.set(f.index, f.card);
    // Already unlocked: replay the glow on those cards instead.
    const cards = render(fresh.size ? fresh : new Set(found.map((f) => f.index)));
    const names = found.filter((f) => !fresh.size || fresh.has(f.index)).map((f) => f.card.title).join(' & ');
    say(fresh.size ? `Unlocked ${names}!` : `You already have ${names}.`, 'ok');
    cards.get(found[0].index).scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // Codes typed before are remembered in this browser, so unlocked games stay unlocked.
  (async () => {
    const codes = savedCodes();
    const results = await Promise.all(codes.map((c) => open(c).catch(() => [])));
    const still = codes.filter((c, i) => results[i].length);
    if (still.length !== codes.length) saveCodes(still);
    for (const f of results.flat()) unlocked.set(f.index, f.card);
    render();
  })();
  if (window.matchMedia('(pointer: fine)').matches) el.input.focus();

  function renderMe() {
    const me = Arcade.player;
    document.getElementById('me-face').innerHTML = Arcade.character();
    document.getElementById('me-name').textContent = me.name;
    document.getElementById('me-tix').innerHTML = `${Arcade.ticketIcon}${me.tickets.toLocaleString('en-US')} tickets`;
    document.documentElement.style.setProperty('--me', me.color);
  }
  renderMe();
  Arcade.onChange(renderMe);
  document.getElementById('me-chip').addEventListener('click', () => Arcade.open());

  // Drifting game-controller shapes: triangle, circle, square and cross.
  const SHAPES = [
    '<path d="M12 3 22 20H2Z"/>',
    '<circle cx="12" cy="12" r="9"/>',
    '<rect x="3.5" y="3.5" width="17" height="17" rx="2"/>',
    '<path d="M5 5 19 19M19 5 5 19"/>',
  ];
  const TINTS = ['var(--cyan)', 'var(--violet)', 'var(--pink)'];
  const shapes = document.getElementById('shapes');
  for (let i = 0; i < 16; i++) {
    const size = 22 + Math.random() * 40;
    const duration = 16 + Math.random() * 18;
    shapes.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 24 24" width="${size}" height="${size}"
      style="left:${Math.random() * 100}%;color:${TINTS[i % TINTS.length]};animation-duration:${duration}s;animation-delay:${-Math.random() * duration}s">${SHAPES[i % SHAPES.length]}</svg>`);
  }
</script>
