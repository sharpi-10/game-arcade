<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Game Arcade</title>
<link rel="stylesheet" href="shared/ui.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    font: 15px/1.45 var(--ui-font); color: var(--ui-text); background: var(--ui-bg);
  }
  /* ---------- Top: your character ---------- */
  .top {
    max-width: 1040px; margin: 0 auto; display: flex; justify-content: flex-end;
    padding: max(16px, env(safe-area-inset-top)) 16px 0;
  }
  .me-chip {
    display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 4px; border-radius: 22px; cursor: pointer;
    font: inherit; color: var(--ui-text); text-align: left;
    background: var(--ui-surface); border: 1px solid var(--ui-line);
  }
  .me-chip:hover { background: var(--ui-sunken); }
  .me-face { width: 36px; height: 36px; flex: none; border-radius: 50%; overflow: hidden; background: var(--ui-sunken); }
  .me-face svg { width: 100%; height: 100%; display: block; }
  .me-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .me-text b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .me-text span { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ui-muted); font-variant-numeric: tabular-nums; }
  /* ---------- Games ---------- */
  main { max-width: 1040px; margin: 0 auto; padding: 16px 16px calc(72px + env(safe-area-inset-bottom)); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column; overflow: hidden; border-radius: 14px;
    color: inherit; text-decoration: none; background: var(--ui-surface); border: 1px solid var(--ui-line);
    transition: border-color .15s, box-shadow .15s;
  }
  .card:hover { border-color: var(--ui-line-strong); box-shadow: var(--ui-shadow); }
  .card.fresh { animation: card-in .5s ease-out; }
  @keyframes card-in { from { opacity: 0; transform: translateY(12px); } }
  .thumb { aspect-ratio: 16 / 10; overflow: hidden; border-bottom: 1px solid var(--ui-line); }
  .thumb svg { width: 100%; height: 100%; display: block; }
  .card-body { display: flex; flex-direction: column; gap: 4px; flex: 1; padding: 14px 16px 16px; }
  .card h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .card p { flex: 1; margin: 0; font-size: 14px; color: var(--ui-muted); }
  .best { margin-top: 10px; font-size: 13px; color: var(--ui-muted); }
  .best strong { font-weight: 600; color: var(--ui-text); font-variant-numeric: tabular-nums; }
  /* ---------- Code button, tucked in the corner ---------- */
  .code-btn {
    position: fixed; z-index: 5; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
    width: 36px; height: 36px; padding: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    color: var(--ui-muted); background: var(--ui-surface); border: 1px solid var(--ui-line);
    opacity: .5; transition: opacity .15s;
  }
  .code-btn:hover, .code-btn:focus-visible { opacity: 1; }
  .code-btn svg { width: 16px; height: 16px; }
  /* ---------- Code popup ---------- */
  .code-pop {
    width: min(420px, calc(100% - 32px)); margin: auto; padding: 20px; border-radius: 16px;
    color: var(--ui-text); background: var(--ui-surface); border: 1px solid var(--ui-line); box-shadow: var(--ui-shadow);
  }
  .code-pop::backdrop { background: rgba(24, 24, 27, .3); }
  .code-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .code-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .code-close {
    width: 32px; height: 32px; flex: none; padding: 0; border-radius: 8px; cursor: pointer;
    font-size: 18px; line-height: 1; color: var(--ui-muted); background: none; border: 1px solid transparent;
  }
  .code-close:hover { color: var(--ui-text); background: var(--ui-sunken); }
  .code-box { display: flex; gap: 8px; }
  .code-box input {
    flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 10px; outline: none;
    font: 500 16px var(--ui-font); letter-spacing: .06em; text-transform: uppercase; color: var(--ui-text);
    background: var(--ui-surface); border: 1px solid var(--ui-line);
  }
  .code-box input::placeholder { letter-spacing: 0; text-transform: none; color: var(--ui-muted); }
  .code-box input:focus { border-color: var(--ui-accent); }
  .code-box.wrong input { border-color: var(--ui-bad); animation: shake .35s; }
  .code-box.right input { border-color: var(--ui-good); }
  @keyframes shake { 25%, 75% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
  .code-msg { min-height: 20px; margin: 10px 0 0; font-size: 14px; }
  .code-msg.ok { color: var(--ui-good); }
  .code-msg.bad { color: var(--ui-bad); }
  @media (prefers-reduced-motion: reduce) {
    .card.fresh, .code-box.wrong input { animation: none; }
  }
</style>
</head>
<body>
<header class="top">
  <button class="me-chip" id="me-chip" type="button" aria-label="Your character, tickets, quests and prizes">
    <span class="me-face" id="me-face"></span>
    <span class="me-text"><b id="me-name"></b><span id="me-tix"></span></span>
  </button>
</header>
<main>
  <div class="grid" id="games"></div>
</main>
<button class="code-btn" id="code-btn" type="button" aria-label="Enter a code" title="Got a code?">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 19 4M15.5 7.5l3 3M13.5 9.5l2 2"/></svg>
</button>
<dialog class="code-pop" id="code-pop" aria-labelledby="code-title">
<form id="code-form" autocomplete="off">
  <div class="code-head"><h2 id="code-title">Got a code?</h2><button class="code-close" id="code-close" type="button" aria-label="Close">×</button></div>
  <div class="code-box" id="code-box">
    <input id="code" type="text" placeholder="Enter a code" aria-label="Game code" maxlength="40"
      autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button class="ui-btn primary" id="unlock" type="submit">Unlock</button>
  </div>
  <p class="code-msg" id="code-msg" role="status" aria-live="polite"></p>
</form>
</dialog>
<script src="shared/arcade.js"></script>

    { iv: 'CKfTrzqIEyWDTEqP', data: 'aCxqzIPBKOtcz/zVdUnAu/+oJcq9KMukjyKn6JfcOX2hdqFJFw4mFuT6' },
  ];
  /* LOCKED:end */

  const SAVED_KEY = 'arcade.codes';
  // Codes ignore case, spaces and dashes.
  const normalize = (code) => code.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

  const el = {
    pop: document.getElementById('code-pop'),
    form: document.getElementById('code-form'),
    box: document.getElementById('code-box'),
    input: document.getElementById('code'),
    button: document.getElementById('unlock'),
    msg: document.getElementById('code-msg'),
    games: document.getElementById('games'),
  };
  const unlocked = new Map(); // LOCKED index -> card

  function savedCodes() {
    try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || []; } catch { return []; }
  }
  function saveCodes(codes) {
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(codes)); } catch { /* storage unavailable */ }
  }

  // Every card the code opens, as [{ index, card }]. A wrong code opens none.
  async function open(code) {
    if (!window.crypto || !crypto.subtle) throw new Error('no-crypto');
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(SALT), iterations: ITERATIONS, hash: 'SHA-256' },
      base,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt'],
    );
    const found = [];
    for (const [index, box] of LOCKED.entries()) {
      try {
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(box.iv) }, key, bytes(box.data));
        found.push({ index, card: JSON.parse(new TextDecoder().decode(plain)) });
      } catch { /* locked with a different code */ }
    }
    return found;
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    return `${m}:${(s - m * 60).toFixed(2).padStart(5, '0')}`;
  }

  // The first stat with a saved value (or a fallback), e.g. "Chips: $1,000".
  function statLine(card) {
    for (const s of card.stats || []) {
      let value = s.fallback;
      try {
        const raw = localStorage.getItem(s.key);
        if (raw !== null) value = Number(JSON.parse(raw));
      } catch { /* unreadable: use the fallback */ }
      if (value === undefined || !Number.isFinite(value)) continue;
      const strong = document.createElement('strong');
      strong.textContent = s.format === 'time' ? formatTime(value) : `$${Math.round(value).toLocaleString('en-US')}`;
      return [`${s.label}: `, strong];
    }
    return [card.empty || ''];
  }

  function cardEl(card) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = card.href;
    a.innerHTML = `
      <div class="thumb">${card.art}</div>
      <div class="card-body">
        <h2></h2>
        <p></p>
        <span class="best"></span>
      </div>`;
    a.querySelector('h2').textContent = card.title;
    a.querySelector('p').textContent = card.description;
    a.querySelector('.best').append(...statLine(card));
    return a;
  }

  // Each game brings its own quests and prizes for your character.
  const dirOf = (href) => href.slice(0, href.lastIndexOf('/') + 1);
  const loadedRewards = new Set();
  function loadRewards(href, { again = false } = {}) {
    const dir = dirOf(href);
    if (loadedRewards.has(dir) && !again) return;
    loadedRewards.add(dir);
    const script = document.createElement('script');
    script.src = `${dir}rewards.js`;
    document.head.append(script);
  }

  // Games can keep part of themselves behind a code (the casino's blackjack and poker tables),
  // so remember which folders a code has opened. A game whose rewards are already loaded loads
  // them again, so newly opened quests and prizes show up straight away.
  function syncUnlocked() {
    const dirs = new Set([...unlocked.values()].map((card) => dirOf(card.href)));
    const changed = [...new Set([...dirs, ...loadedRewards])].filter((d) => dirs.has(d) !== Arcade.unlocked(d));
    Arcade.setUnlocked(dirs);
    for (const dir of changed) if (loadedRewards.has(dir)) loadRewards(dir, { again: true });
  }

  // Open games first, then the ones you've unlocked; `fresh` ones play the unlock animation.
  let codesChecked = false;
  function render(fresh = new Set()) {
    if (codesChecked) syncUnlocked();
    const cards = new Map();
    const all = [...OPEN.map((card, i) => [`open-${i}`, card]),
      ...[...unlocked.keys()].sort((x, y) => x - y).map((index) => [index, unlocked.get(index)])];
    for (const [key, card] of all) {
      loadRewards(card.href);
      const a = cardEl(card);
      if (fresh.has(key)) a.classList.add('fresh');
      cards.set(key, a);
    }
    el.games.replaceChildren(...cards.values());
    return cards;
  }

  let msgTimer = 0;
  function say(text, kind) {
    el.msg.textContent = text;
    el.msg.className = `code-msg ${kind}`;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { el.msg.textContent = ''; }, 4000);
  }

  function flash(cls) {
    el.box.classList.remove('wrong', 'right');
    void el.box.offsetWidth;
    el.box.classList.add(cls);
    setTimeout(() => el.box.classList.remove(cls), 1200);
  }

  // The code box lives in a popup behind the button in the corner.
  function openPop() {
    el.msg.textContent = '';
    el.pop.showModal();
    el.input.focus();
  }
  document.getElementById('code-btn').addEventListener('click', openPop);
  document.getElementById('code-close').addEventListener('click', () => el.pop.close());
  el.pop.addEventListener('click', (e) => { if (e.target === el.pop) el.pop.close(); }); // the backdrop

  // A code can open a tool instead of a game (the owner's control panel). Its script hands back
  // an open function as window.arcadeTool; codes for tools are never remembered.
  const tools = new Map();
  function openTool(src) {
    if (tools.has(src)) { tools.get(src)(); return; }
    const script = document.createElement('script');
    script.src = src;
    script.onload = () => {
      tools.set(src, window.arcadeTool);
      delete window.arcadeTool;
      tools.get(src)();
    };
    document.head.append(script);
  }

  el.form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = normalize(el.input.value);
    if (!code) { el.input.focus(); return; }
    el.button.disabled = true;
    let found = [];
    try {
      found = await open(code);
    } catch {
      el.button.disabled = false;
      say('Codes only work when the site is opened over https.', 'bad');
      return;
    }
    el.button.disabled = false;
    if (!found.length) {
      flash('wrong');
      say('That code doesn\'t work.', 'bad');
      el.input.select();
      return;
    }
    el.input.value = '';
    if (found.every((f) => f.card.tool)) {
      el.pop.close();
      for (const f of found) openTool(f.card.tool);
      return;
    }
    found = found.filter((f) => !f.card.tool);
    flash('right');
    const codes = savedCodes();
    if (!codes.includes(code)) saveCodes([...codes, code]);
    const fresh = new Set(found.map((f) => f.index).filter((i) => !unlocked.has(i)));
    for (const f of found) unlocked.set(f.index, f.card);
    // Already unlocked: replay the glow on those cards instead.
    const cards = render(fresh.size ? fresh : new Set(found.map((f) => f.index)));
    const names = found.filter((f) => !fresh.size || fresh.has(f.index)).map((f) => f.card.title).join(' & ');
    say(fresh.size ? `Unlocked ${names}!` : `You already have ${names}.`, 'ok');
    setTimeout(() => {
      el.pop.close();
      cards.get(found[0].index).scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 1100);
  });

  // Codes typed before are remembered in this browser, so unlocked games stay unlocked.
  render();
  (async () => {
    const codes = savedCodes();
    const results = await Promise.all(codes.map((c) => open(c).catch(() => [])));
    const still = codes.filter((c, i) => results[i].length);
    if (still.length !== codes.length) saveCodes(still);
    for (const f of results.flat()) if (!f.card.tool) unlocked.set(f.index, f.card);
    codesChecked = true;
    render();
  })();

  function renderMe() {
    const me = Arcade.player;
    document.getElementById('me-face').innerHTML = Arcade.character();
    document.getElementById('me-name').textContent = me.name;
    document.getElementById('me-tix').innerHTML = `${Arcade.ticketIcon}${me.tickets.toLocaleString('en-US')} tickets`;
  }
  renderMe();
  Arcade.onChange(renderMe);
  document.getElementById('me-chip').addEventListener('click', () => Arcade.open());
</script>
